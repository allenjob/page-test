<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A fullscreen animated fireworks page built with plain HTML, CSS, and JavaScript.">
  <title>Fireworks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <canvas id="fireworksCanvas" aria-label="Animated fireworks display"></canvas>
    <div class="overlay">
      <p class="subtitle">Fullscreen Animation</p>
      <h1>Fireworks in the Night Sky</h1>
      <button id="replayButton" type="button">Replay Fireworks</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
